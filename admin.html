<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - Admin Tài Xỉu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-4 max-w-xl mx-auto space-y-4">

    <header class="card rounded-2xl p-4 flex justify-between items-center shadow-lg border-amber-500">
        <div>
            <h1 class="font-bold text-amber-400 text-base"><i class="fa-solid fa-user-shield"></i> PANEL QUẢN TRỊ ADMIN</h1>
            <p class="text-[11px] text-slate-400">Quản lý duyệt rút tiền và tài khoản</p>
        </div>
        <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl text-slate-300 font-bold border border-slate-700">
            <i class="fa-solid fa-rotate"></i> Làm mới
        </button>
    </header>

    <!-- DUYỆT RÚT TIỀN -->
    <section class="card rounded-2xl p-4 space-y-3">
        <h2 class="text-xs font-bold text-amber-400 uppercase border-b border-slate-700 pb-2">
            <i class="fa-solid fa-money-check-dollar"></i> Yêu Cầu Rút Tiền Chờ Duyệt
        </h2>
        <div id="withdrawListContainer" class="space-y-2 text-xs font-mono max-h-60 overflow-y-auto">
            <p class="text-slate-400 text-center py-2">Đang tải...</p>
        </div>
    </section>

    <!-- CỘNG TRỪ TIỀN USER -->
    <section class="card rounded-2xl p-4 space-y-3">
        <h2 class="text-xs font-bold text-emerald-400 uppercase border-b border-slate-700 pb-2">
            <i class="fa-solid fa-coins"></i> Quản Lý Số Dư Người Chơi
        </h2>
        <div id="userInfoBox" class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
            <p class="text-slate-400">Người chơi gần nhất: <b id="pName" class="text-amber-400">Chưa có</b></p>
            <p class="text-slate-400">Số dư hiện tại: <b id="pBalance" class="text-emerald-400">0 VNĐ</b></p>
        </div>
        <div class="space-y-2">
            <input type="number" id="adminAmount" placeholder="Nhập số tiền muốn cộng/trừ" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-mono">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="adjustMoney('ADD')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded-xl shadow">Cộng Tiền</button>
                <button onclick="adjustMoney('SUB')" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-2 rounded-xl shadow">Trừ Tiền</button>
            </div>
        </div>
    </section>

    <script>
        function loadAdminData() {
            // Hiển thị thông tin user đang chơi
            let stats = JSON.parse(localStorage.getItem('tx_my_stats'));
            if (stats) {
                document.getElementById('pName').innerText = `${stats.name} (${stats.acc})`;
                document.getElementById('pBalance').innerText = (stats.balance || 0).toLocaleString() + " VNĐ";
            }

            // Hiển thị danh sách rút tiền
            let reqs = JSON.parse(localStorage.getItem('tx_withdraws')) || [];
            let container = document.getElementById('withdrawListContainer');

            let pending = reqs.filter(r => r.status === 'Chờ duyệt');
            if (pending.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center py-2">Không có yêu cầu rút nào đang chờ.</p>`;
                return;
            }

            container.innerHTML = reqs.map((r, idx) => `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1">
                    <div class="flex justify-between font-bold text-amber-400">
                        <span>${r.user} (${r.acc})</span>
                        <span class="text-emerald-400">${r.amount.toLocaleString()} VNĐ</span>
                    </div>
                    <p class="text-slate-300 text-[11px]">Thông tin nhận: ${r.bank}</p>
                    <div class="flex justify-between items-center pt-1">
                        <span class="text-[10px] ${r.status === 'Chờ duyệt' ? 'text-amber-400' : (r.status === 'Đã duyệt' ? 'text-emerald-400' : 'text-rose-400')}">Trạng thái: <b>${r.status}</b></span>
                        ${r.status === 'Chờ duyệt' ? `
                            <div class="flex gap-1">
                                <button onclick="processReq(${idx}, 'APPROVE')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-[10px] font-bold">Duyệt</button>
                                <button onclick="processReq(${idx}, 'REJECT')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded text-[10px] font-bold">Từ chối</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function processReq(idx, action) {
            let reqs = JSON.parse(localStorage.getItem('tx_withdraws')) || [];
            if (action === 'APPROVE') {
                reqs[idx].status = 'Đã duyệt';
                alert("Đã duyệt lệnh rút thành công!");
            } else {
                reqs[idx].status = 'Đã từ chối';
                // Hoàn tiền lại cho user
                let currentBal = parseInt(localStorage.getItem('user_balance')) || 0;
                let newBal = currentBal + reqs[idx].amount;
                localStorage.setItem('user_balance', newBal);
                let stats = JSON.parse(localStorage.getItem('tx_my_stats')) || {};
                stats.balance = newBal;
                localStorage.setItem('tx_my_stats', JSON.stringify(stats));
                alert("Đã từ chối và hoàn tiền cho người chơi.");
            }
            localStorage.setItem('tx_withdraws', JSON.stringify(reqs));
            loadAdminData();
        }

        function adjustMoney(type) {
            let amt = parseInt(document.getElementById('adminAmount').value);
            if (isNaN(amt) || amt <= 0) return alert("Vui lòng nhập số tiền hợp lệ!");

            let currentBal = parseInt(localStorage.getItem('user_balance')) || 0;
            if (type === 'ADD') {
                currentBal += amt;
                alert(`Đã cộng thêm ${amt.toLocaleString()}đ cho người chơi!`);
            } else {
                currentBal = Math.max(0, currentBal - amt);
                alert(`Đã trừ ${amt.toLocaleString()}đ của người chơi!`);
            }

            localStorage.setItem('user_balance', currentBal);
            let stats = JSON.parse(localStorage.getItem('tx_my_stats')) || { name: "Người chơi" };
            stats.balance = currentBal;
            localStorage.setItem('tx_my_stats', JSON.stringify(stats));
            loadAdminData();
        }

        loadAdminData();
    </script>
</body>
</html>
